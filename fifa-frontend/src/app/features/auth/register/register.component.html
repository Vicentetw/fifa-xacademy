<div class="register-container">
    <div class="register-card">
        <h2>Registro</h2>
        <form [formGroup]="form" (ngSubmit)="register()">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" formControlName="email" placeholder="nombre@gmail.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" formControlName="password" placeholder="Mínimo 8 caracteres, una mayúscula y un carácter especial" />
                <small class="hint">La contraseña debe tener al menos 8 caracteres, incluir una letra mayúscula y un símbolo.</small>
            </div>
            <button class="submit-btn" type="submit" [disabled]="form.invalid || isLoading">Registrarse</button>
        </form>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
    <p>
      ¿Ya tienes cuenta?
      <a [routerLink]="['/auth']">Ir a login</a>
    </p>  


    </div>


</div>
